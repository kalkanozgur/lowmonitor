[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "1.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kalkanozgur/lowmonitor"

# Bağımlılıklar ihtiyaç duyulan milestone'da eklenir (spek §3 taslağı).
[workspace.dependencies]
windows-service = "0.8.1"
windows-sys = "0.61.2"  # windows-service zaten çekiyor; ek derleme maliyeti yok
chacha20poly1305 = { version = "0.11.0", default-features = false }
hkdf = "0.13.0"
sha2 = { version = "0.11.1", default-features = false }
getrandom = "0.4.3"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }
proptest = "1.12.0"  # yalnızca dev-dependency
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }  # lowmon-net (spek §16.1)
serde_json = "1.0.154"
httparse = "1.10.1"  # tungstenite zaten çekiyor
windows = "0.62"  # lowmon-deck: Core Audio COM + SMTC WinRT (ADR-0031)
windows-core = "0.62"
slint = { version = "1.18.1", default-features = false }  # yalnız lowmon-ui (ADR-0031); Royalty-free 2.0
slint-build = "1.18.1"
lowvolume = { git = "https://github.com/kalkanozgur/lowvolume", tag = "v0.1.1" }  # lowmon-tray (ADR-0039)

[profile.release]
opt-level     = 3        # svc için "s" ile karşılaştırılacak (spek §15)
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true
debug         = false

# lowmon-ui (Slint) boyut profili: ui + tüm bağımlılıkları "s"; diğer exe'ler O3 kalır.
# Ölçüm docs/olcumler/2026-11-16_lowmon-ui-opt.md: 10,52 → 8,90 MB, CPU farkı gürültü düzeyinde.
[profile.release-ui]
inherits  = "release"
opt-level = "s"
