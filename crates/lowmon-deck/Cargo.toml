[package]
name = "lowmon-deck"
description = "LowDeck telefon/PC arayüzü sunucusu: hub, dinleyiciler, UDP keşif, Core Audio/SMTC/kilit, pipe köprüsü (ADR-0031)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lowmon-proto = { path = "../lowmon-proto" }
# Telefon protokolü LowDeck'te kalır (ADR-0031 §3); rev = LowDeck main.
lowdeck-proto = { git = "https://github.com/kalkanozgur/lowdeck", rev = "7d5b5b4" }

# Core Audio (COM) ve SMTC (WinRT) windows-sys'te yok.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Media_Control",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
] }
# #[implement] makrosu bu crate'i doğrudan ister; windows zaten çekiyor.
windows-core.workspace = true
